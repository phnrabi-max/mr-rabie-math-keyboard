
name: Build Mister Mohammed Rabie Math Keyboard

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -q MisterMohammedRabieMathKeyboard_Source.zip -d project
          find project -name settings.gradle -print

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle | head -n 1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mister-Mohammed-Rabie-Math-Keyboard
          path: project/**/build/outputs/apk/debug/*.apk
