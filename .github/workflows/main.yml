name: Build Mister Mohammed Rabie Math Keyboard

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -q MisterMohammedRabieMathKeyboard_Source.zip -d project

      - name: Inspect Android Gradle settings
        run: |
          APP_FILE=$(find project -path "*/app/build.gradle" | head -n 1)
          echo "APP FILE: $APP_FILE"
          echo "========== BUILD.GRADLE =========="
          cat "$APP_FILE"
          echo "========== END BUILD.GRADLE =========="

      - name: Stop after inspection
        run: |
          echo "Inspection completed successfully."
