
name: Build Mister Mohammed Rabie Math Keyboard

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -q MisterMohammedRabieMathKeyboard_Source.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Force Java compatibility to 17
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle | head -n 1)")
          cd "$PROJECT_DIR"
          sed -i 's/VERSION_1_8/VERSION_17/g' app/build.gradle
          echo "Checking Java and Kotlin settings:"
          grep -nE 'sourceCompatibility|targetCompatibility|jvmTarget' app/build.gradle
          if grep -q 'VERSION_1_8' app/build.gradle; then
            echo "Java 1.8 setting still exists."
            exit 1
          fi

      - name: Build Android APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle | head -n 1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mister-Mohammed-Rabie-Math-Keyboard
          path: project/**/build/outputs/apk/debug/*.apk
