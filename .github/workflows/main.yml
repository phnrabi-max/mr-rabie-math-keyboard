
name: Build Mister Mohammed Rabie Math Keyboard

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check and Extract Project ZIP
        run: |
          ZIP_FILE="MisterMohammedRabieMathKeyboard_Source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP file not found!"
            echo "Files in repository:"
            ls -lah
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "SUCCESS: Project ZIP extracted"

      - name: Install Updated Math Keyboard Service
        run: |
          SOURCE_FILE="$GITHUB_WORKSPACE/MathKeyboardService.kt"

          if [ ! -f "$SOURCE_FILE" ]; then
            echo "ERROR: MathKeyboardService.kt not found"
            exit 1
          fi

          TARGET_FILE=$(find project -name "MathKeyboardService.kt" | head -n 1)

          if [ -z "$TARGET_FILE" ]; then
            echo "ERROR: Original MathKeyboardService.kt not found"
            exit 1
          fi

          cp "$SOURCE_FILE" "$TARGET_FILE"

          echo "SUCCESS: Keyboard service updated"
          echo "Target: $TARGET_FILE"

      - name: Configure Java and Kotlin
        run: |
          APP_FILE=$(find project -path "*/app/build.gradle" | head -n 1)

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          python3 - "$APP_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "    defaultConfig {",
                  """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              defaultConfig {"""
              )

          p.write_text(s)
          print("SUCCESS: Java and Kotlin configured")
          PY

      - name: Fix Kotlin singleLine Property
        run: |
          KOTLIN_FILE=$(find project -name MainActivity.kt | head -n 1)

          if [ -z "$KOTLIN_FILE" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi

          python3 - "$KOTLIN_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          old = "singleLine = true"
          new = "setSingleLine(true)"

          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
              print("SUCCESS: singleLine fixed")
          elif new in s:
              print("Already fixed")
          else:
              print("No singleLine property needs fixing")

          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: |
          SETTINGS_FILE=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$PROJECT_DIR"

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mister-Mohammed-Rabie-Math-Keyboard
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
