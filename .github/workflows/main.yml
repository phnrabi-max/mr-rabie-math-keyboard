
name: Build Mister Mohammed Rabie Math Keyboard

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -q MisterMohammedRabieMathKeyboard_Source.zip -d project

      - name: Configure Java and Kotlin
        run: |
          APP_FILE=$(find project -path "*/app/build.gradle" | head -n 1)

          python3 - "$APP_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "    defaultConfig {",
                  """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              defaultConfig {"""
              )

          p.write_text(s)
          PY

      - name: Inspect Kotlin error
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle | head -n 1)")
          echo "========== MAIN ACTIVITY LINES 65-85 =========="
          nl -ba "$PROJECT_DIR/app/src/main/java/com/mohammedrabie/mathkeyboard/MainActivity.kt" | sed -n '65,85p'
          echo "========== END INSPECTION =========="

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle | head -n 1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mister-Mohammed-Rabie-Math-Keyboard
          path: project/**/build/outputs/apk/debug/*.apk
