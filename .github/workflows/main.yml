
name: Build Mister Mohammed Rabie Math Keyboard

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -q MisterMohammedRabieMathKeyboard_Source.zip -d project

      - name: Install updated Math Keyboard Service
        run: |
          SOURCE_FILE="$GITHUB_WORKSPACE/MathKeyboardService.kt"

          if [ ! -f "$SOURCE_FILE" ]; then
            echo "ERROR: Uploaded MathKeyboardService.kt was not found"
            exit 1
          fi

          TARGET_FILE=$(find project -name "MathKeyboardService.kt" | head -n 1)

          if [ -z "$TARGET_FILE" ]; then
            echo "ERROR: Original MathKeyboardService.kt was not found inside project ZIP"
            exit 1
          fi

          cp "$SOURCE_FILE" "$TARGET_FILE"

          echo "SUCCESS: Updated keyboard service installed"
          echo "Target: $TARGET_FILE"

      - name: Configure Java and Kotlin
        run: |
          APP_FILE=$(find project -path "*/app/build.gradle" | head -n 1)

          python3 - "$APP_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "    defaultConfig {",
                  """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              defaultConfig {"""
              )

          p.write_text(s)
          PY

      - name: Fix Kotlin singleLine property
        run: |
          KOTLIN_FILE=$(find project -name MainActivity.kt | head -n 1)

          python3 - "$KOTLIN_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          old = "singleLine = true"
          new = "setSingleLine(true)"

          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
              print("SUCCESS: singleLine fixed")
          elif new in s:
              print("Already fixed")
          else:
              raise SystemExit("ERROR: Expected singleLine code was not found")

          print("========== FIXED LINE ==========")
          for line in s.splitlines():
              if "setSingleLine(true)" in line:
                  print(line)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle | head -n 1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mister-Mohammed-Rabie-Math-Keyboard
          path: project/**/build/outputs/apk/debug/*.apk
